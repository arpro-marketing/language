
			<style>
/* ============================================================
   ARM · Electrician Marketing · Conversion Hub v2 (2026-10-16)
   Shared stylesheet, adapted from the hub v2 template (.arm-el)
   Brand 60/30/10 · white / #333 / #EF662F · Helvetica · left-aligned default
   ============================================================ */
.arm-el{

/* DEPLOY GEOMETRY (CONVENTION-WPBakery-Row-Zero-Bottom-Spacer-2026-09-02): rows carry margin-top:-35px, the raw-HTML box margin-bottom:-20px. The row is overflow:hidden and clips the last 20px of every block; the next row starts 35px above the clip line. padding-top:35px lands flush; padding-bottom:20px is the sacrificial band. Hero = padding-top:0. */

  padding:16px 30px;border-radius:8px;border:0;cursor:pointer;font-family:inherit;transition:background .2s ease,transform .2s ease,box-shadow .2s ease}
